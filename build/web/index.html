<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- SEO & Description -->
  <meta name="description" content="منصة Smart Academy التعليمية - بيئة تعلّم ذكية وتفاعلية للطلاب والمعلمين والمشرفين">
  <meta name="keywords" content="Smart Academy, تعليم, منصة تعليمية, طلاب, معلمين">
  <meta name="author" content="Smart Academy">
  <meta name="robots" content="index, follow">

  <!-- PWA: Theme color for browser chrome (Android Chrome, Edge) -->
  <meta name="theme-color" content="#0D9B8A">

  <!-- PWA: Make the app installable on Android -->
  <meta name="mobile-web-app-capable" content="yes">

  <!-- iOS PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Smart Academy">

  <!-- iOS Touch Icons (multiple sizes for different devices) -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Microsoft Tiles (Windows/Edge) -->
  <meta name="msapplication-TileColor" content="#0D9B8A">
  <meta name="msapplication-TileImage" content="icons/Icon-192.png">
  <meta name="msapplication-tap-highlight" content="no">

  <!-- Open Graph (for social sharing) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Smart Academy">
  <meta property="og:description" content="منصة Smart Academy التعليمية - بيئة تعلّم ذكية وتفاعلية">
  <meta property="og:image" content="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="shortcut icon" href="favicon.png">

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <title>Smart Academy</title>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
